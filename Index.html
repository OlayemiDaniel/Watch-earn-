<script type="module">
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

const firebaseConfig2 = {
  apiKey: "AIzaSyCENQb44hOSUfiuewcuh2g5t9QNw1EWdn8",
  authDomain: "watch-earn-d8f52.firebaseapp.com",
  projectId: "watch-earn-d8f52",
  storageBucket: "watch-earn-d8f52.firebasestorage.app",
  messagingSenderId: "294583106675",
  appId: "1:294583106675:web:27e5d146f53af057ba7e06"
};
const app2 = initializeApp(firebaseConfig2, "second");
const db2 = getFirestore(app2);
const tg2 = window.Telegram.WebApp;
const userId2 = tg2.initDataUnsafe?.user?.id?.toString() || "test123";
const username2 = tg2.initDataUnsafe?.user?.username || "test_user";
let userData2 = { balance: 0, adsToday: 0, lastDate: new Date().toDateString() };
const userRef2 = doc(db2, "users", userId2);

async function load2(){
  const snap = await getDoc(userRef2);
  if(snap.exists()){
    userData2 = snap.data();
    if(userData2.lastDate !== new Date().toDateString()){
      userData2.adsToday = 0;
      userData2.lastDate = new Date().toDateString();
      await updateDoc(userRef2, userData2);
    }
  }
  window.userDataGlobal = userData2;
  document.getElementById('bal').innerText = userData2.balance.toFixed(3);
  document.getElementById('ads').innerText = userData2.adsToday;
}
load2();

const AdCtrl = window.Adsgram.init({ blockId: "YOUR_ADSGRAM_BLOCK_ID" });

window.watchAd = async function(){
  const msgEl = document.getElementById('msg');
  if(userData2.adsToday >= 25){
    msgEl.innerText = "Daily limit reached";
    return;
  }
  try{
    const res = await AdCtrl.show();
    // Try Monetag after
    try{
      if(window.show_9764122) { window.show_9764122(); } // Monetag function
    }catch(e){}

    if(res.done){
      userData2.balance += 0.002;
      userData2.adsToday += 1;
      await updateDoc(userRef2, userData2);
      window.userDataGlobal = userData2;
      document.getElementById('bal').innerText = userData2.balance.toFixed(3);
      document.getElementById('ads').innerText = userData2.adsToday;
      msgEl.innerText = "✅ +$0.002 added";
    }
  }catch(e){
    msgEl.innerText = "No ad available, try again";
  }
}

window.withdraw = async function(){
  const msgEl = document.getElementById('msg');
  if(userData2.balance < 1){
    msgEl.innerText = "Min $1 to withdraw";
    return;
  }
  await addDoc(collection(db2, "withdrawals"), {
    userId: userId2,
    username: username2,
    amount: userData2.balance,
    date: new Date(),
    status: "pending"
  });
  msgEl.innerText = "Withdraw request sent! Paid in 24h";
  userData2.balance = 0;
  await updateDoc(userRef2, userData2);
  document.getElementById('bal').innerText = "0.000";
}
</script>
